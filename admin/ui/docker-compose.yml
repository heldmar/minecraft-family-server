# Admin UI for MarNar's Minecraft Server.
#
# Deployed to /home/mcadmin/stacks/mc-admin/ on the server, CLI-first, per
# the host's rules. Portainer there is a viewer, not a deploy path.
#
# Reached at https://minecraft-admin.example.net through Nginx Proxy Manager,
# with an NPM Access List doing the authentication. Single-level hostname with a
# hyphen — Cloudflare's Universal SSL covers *.example.net and one level only, so
# a dotted name would fail at the TLS handshake.

services:
  mc-admin:
    build: /home/mcadmin/stacks/mc-admin/src     # rsync'd from the repo's admin/ui/
    image: mc-admin-ui:latest
    pull_policy: build                       # build-only; never pulled from a registry
    container_name: mc-admin
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]

    environment:
      # Same-origin proxy: the browser calls /api/... on this domain and nginx
      # forwards to the host agent, so the token never reaches the browser.
      API_BASE_URL: "/api"
      # The host as reached FROM the container = the npm-network bridge gateway.
      # 8788, not 8787 — 8787 is already taken on this host.
      API_UPSTREAM: "http://172.18.0.1:8788"
      REFRESH_SECONDS: "20"
      # Injected server-side into the /api proxy. Value lives in .env, which is
      # not committed, and must match MCADMIN_TOKEN in the agent's environment.
      API_TOKEN: "${API_TOKEN:?API_TOKEN must be set in .env}"

    # Static nginx serving four files plus a proxy. It does not need more.
    mem_limit: 96m
    memswap_limit: 128m
    mem_reservation: 24m

    networks:
      - npm-network

networks:
  npm-network:
    external: true
