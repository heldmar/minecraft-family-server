server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Recover the real client address from the header NPM sets.
    #
    # Without this, $remote_addr in this container is NPM's address on
    # npm-network, and the /api/ proxy forwards THAT to the agent — so the admin
    # audit log recorded "172.18.0.x" for every restart, ban and upload rather
    # than a person. (Fixed upstream on 2026-08-14: NPM had been reading
    # X-Real-IP, which Cloudflare does not send, and now reads CF-Connecting-IP
    # and passes the true client down as X-Real-IP.)
    #
    # Done here at server level rather than in the /api/ location so $remote_addr
    # is honest for everything in this container — access logs and any future
    # per-IP limit_req — not just the one header the proxy forwards.
    #
    # ⚠️ Trusting the whole bridge subnet is only safe because this container
    # publishes no ports and is on npm-network alone, so nothing outside Docker
    # can open a connection to it and forge the header. Re-check this if a
    # `ports:` mapping or a second network is ever added in docker-compose.yml.
    # Narrower is not available: container addresses are not stable across a
    # recreate, so NPM has no fixed IP to name.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header   X-Real-IP;

    # World uploads are whole Minecraft worlds. The default 1 MB body limit
    # rejects them with a 413 that reads, unhelpfully, as "the upload failed".
    client_max_body_size 2g;
    # And a slow upload from a home connection must not be cut off mid-transfer.
    client_body_timeout 600s;
    proxy_request_buffering off;

    # Same-origin API proxy, written by the entrypoint from $API_UPSTREAM so one
    # image can target any host. This is also where the bearer token is added,
    # server-side — see docker-entrypoint.sh for why that matters.
    include /etc/nginx/mcadmin-api-proxy.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config and the shell must never be cached, or a redeploy leaves
    # the browser talking to the previous configuration.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # Unhashed asset names, so they follow index.html rather than being cached.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # This panel can regenerate a world. It should never appear in a search
    # index, an iframe, or a referrer sent to somebody else's site.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
