server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # World uploads are whole Minecraft worlds. The default 1 MB body limit
    # rejects them with a 413 that reads, unhelpfully, as "the upload failed".
    client_max_body_size 2g;
    # And a slow upload from a home connection must not be cut off mid-transfer.
    client_body_timeout 600s;
    proxy_request_buffering off;

    # Same-origin API proxy, written by the entrypoint from $API_UPSTREAM so one
    # image can target any host. This is also where the bearer token is added,
    # server-side — see docker-entrypoint.sh for why that matters.
    include /etc/nginx/mcadmin-api-proxy.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config and the shell must never be cached, or a redeploy leaves
    # the browser talking to the previous configuration.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # Unhashed asset names, so they follow index.html rather than being cached.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # This panel can regenerate a world. It should never appear in a search
    # index, an iframe, or a referrer sent to somebody else's site.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
