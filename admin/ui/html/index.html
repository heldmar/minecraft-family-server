<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MarNar's Minecraft Server — Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23866043'/><rect width='16' height='6' fill='%235D9C3C'/></svg>">
<link rel="stylesheet" href="/styles.css">
<script src="/config.js"></script>
<script src="/i18n.js"></script>
</head>
<body>

<aside class="sidebar">
  <!-- The official Minecraft logo is Mojang's trademark, so this is a
       blocky wordmark and a hand-drawn grass block rather than the real
       asset — same feel, nothing borrowed. -->
  <div class="brand">
    <svg class="brand-block" viewBox="0 0 16 16" aria-hidden="true">
      <rect width="16" height="16" fill="#866043"/>
      <rect y="9" width="16" height="1" fill="#6B4A2F" opacity=".5"/>
      <rect x="3" y="11" width="2" height="2" fill="#6B4A2F"/>
      <rect x="9" y="12" width="3" height="2" fill="#9A7150"/>
      <rect x="6" y="10" width="2" height="1" fill="#9A7150"/>
      <rect width="16" height="5" fill="#5D9C3C"/>
      <rect y="5" width="16" height="1" fill="#4E8532"/>
      <rect x="1" y="4" width="2" height="2" fill="#6FB247"/>
      <rect x="7" y="5" width="2" height="1" fill="#6FB247"/>
      <rect x="12" y="4" width="2" height="2" fill="#6FB247"/>
      <rect width="16" height="2" fill="#6FB247"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">MarNar's</span>
      <span class="brand-sub" data-i18n="brand.sub"></span>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-item is-active" data-view="players">
      <span class="nav-ico">🎮</span> <span data-i18n="nav.players"></span>
    </button>
    <button class="nav-item" data-view="world">
      <span class="nav-ico">🌍</span> <span data-i18n="nav.world"></span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="nav-ico">⚙️</span> <span data-i18n="nav.settings"></span>
    </button>
    <button class="nav-item" data-view="activity">
      <span class="nav-ico">📜</span> <span data-i18n="nav.activity"></span>
    </button>
  </nav>

  <div class="sidebar-foot">
    <div class="pill" id="side-status"><span class="dot"></span><span data-i18n="side.connecting"></span></div>
    <button class="btn btn-ghost btn-sm" id="btn-restart" data-i18n="btn.restart"></button>
    <details class="help help-tight">
      <summary data-i18n="help.open"></summary>
      <p data-i18n="help.restart"></p>
    </details>
  </div>
</aside>

<main class="main">

  <header class="topbar">
    <div>
      <h1 id="view-title"></h1>
      <p class="muted" id="view-sub"></p>
    </div>
    <div class="topbar-right">
      <div class="stat-mini"><b id="hdr-players">–</b><span data-i18n="hdr.online"></span></div>
      <div class="stat-mini"><b id="hdr-tps">–</b><span data-i18n="hdr.tps"></span></div>
      <div class="stat-mini"><b id="hdr-version">–</b><span data-i18n="hdr.version"></span></div>

      <!-- Language switch (A-2): on every screen, no menu to open. -->
      <div class="langswitch" id="langswitch" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>

      <button class="btn btn-ghost btn-sm" id="btn-refresh" data-i18n-title="btn.refresh">↻</button>
    </div>
  </header>

  <!-- ================= PLAYERS ================= -->
  <section class="view" id="view-players">

    <div class="cards">
      <div class="card stat" data-accent="grass">
        <span class="stat-label" data-i18n="players.rosterLabel"></span>
        <b class="stat-value" id="st-roster">–</b>
        <span class="stat-foot" data-i18n="players.rosterFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.roster"></p></details>
      </div>
      <div class="card stat" data-accent="diamond">
        <span class="stat-label" data-i18n="players.onlineLabel"></span>
        <b class="stat-value" id="st-online">–</b>
        <span class="stat-foot" id="st-online-foot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.online"></p></details>
      </div>
      <div class="card stat" data-accent="gold">
        <span class="stat-label" data-i18n="players.tpsLabel"></span>
        <b class="stat-value" id="st-tps">–</b>
        <span class="stat-foot" data-i18n="players.tpsFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.tps"></p></details>
      </div>
    </div>

    <!-- How to connect. The address itself is DATA and is never translated
         (A-7); only the labels around it come from the dictionary. Values are
         injected at container start via config.js, because the agent talks to
         the game over RCON and has no way to know what public name points at
         it. -->
    <div class="card connect">
      <div class="card-head"><h2 data-i18n="connect.title"></h2></div>
      <p class="muted sm" data-i18n="connect.sub"></p>
      <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.connect"></p></details>
      <div class="connect-rows" id="connect-rows"></div>
    </div>

    <div class="split">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="players.listTitle"></h2>
          <button class="btn btn-ghost btn-sm" id="btn-sync" data-i18n="players.sync"></button>
        </div>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.sync"></p></details>
        <div class="table-wrap">
          <table id="players-table">
            <thead>
              <tr>
                <th data-i18n="players.thTag"></th>
                <th data-i18n="players.thPlatform"></th>
                <th data-i18n="players.thWho"></th>
                <th data-i18n="players.thState"></th>
                <th></th>
              </tr>
            </thead>
            <tbody><tr><td colspan="5" class="empty" data-i18n="players.loading"></td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2 data-i18n="players.addTitle"></h2></div>
        <form id="add-form" class="form">
          <label><span data-i18n="players.platform"></span>
            <select name="platform" required>
              <option value="bedrock" data-i18n="players.platformBedrock"></option>
              <option value="java" data-i18n="players.platformJava"></option>
            </select>
          </label>
          <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.platform"></p></details>

          <label><span data-i18n="players.tag"></span>
            <input name="tag" required autocomplete="off" data-i18n-ph="players.tagPh">
          </label>
          <label><span data-i18n="players.note"></span>
            <input name="note" autocomplete="off" data-i18n-ph="players.notePh">
          </label>

          <div class="hint" data-i18n="players.hint"></div>

          <button class="btn btn-primary" type="submit" data-i18n="players.submit"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= WORLD ================= -->
  <section class="view is-hidden" id="view-world">

    <div class="cards">
      <div class="card stat" data-accent="grass">
        <span class="stat-label" data-i18n="world.seedLabel"></span>
        <b class="stat-value mono sm" id="w-seed">–</b>
        <span class="stat-foot" data-i18n="world.seedFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.seed"></p></details>
      </div>
      <div class="card stat" data-accent="diamond">
        <span class="stat-label" data-i18n="world.borderLabel"></span>
        <b class="stat-value" id="w-border">–</b>
        <span class="stat-foot" data-i18n="world.borderFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.border"></p></details>
      </div>
      <div class="card stat" data-accent="gold">
        <span class="stat-label" data-i18n="world.sizeLabel"></span>
        <b class="stat-value" id="w-size">–</b>
        <span class="stat-foot" data-i18n="world.sizeFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.size"></p></details>
      </div>
      <div class="card stat" data-accent="redstone">
        <span class="stat-label" data-i18n="world.backupsLabel"></span>
        <b class="stat-value" id="w-backups">–</b>
        <span class="stat-foot" data-i18n="world.backupsFoot"></span>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.backups"></p></details>
      </div>
    </div>

    <div class="split">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="world.backupsTitle"></h2>
          <button class="btn btn-ghost btn-sm" id="btn-backup" data-i18n="world.backupNow"></button>
        </div>

        <!-- C-4: the panel must never imply backups happen on their own. -->
        <div class="notice" data-i18n="world.notAuto"></div>
        <p class="muted sm" id="backup-disk"></p>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.disk"></p></details>

        <div class="table-wrap tall">
          <table id="backups-table">
            <thead><tr>
              <th data-i18n="world.thFile"></th>
              <th data-i18n="world.thWhen"></th>
              <th data-i18n="world.thSize"></th>
              <th></th>
            </tr></thead>
            <tbody><tr><td colspan="4" class="empty" data-i18n="players.loading"></td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card-head"><h2 data-i18n="world.importTitle"></h2></div>
          <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.import"></p></details>
          <form id="import-form" class="form">
            <label><span data-i18n="world.importFile"></span>
              <input type="file" name="file" accept=".zip,.tar.gz,.tgz,.tar.zst" required>
            </label>
            <div class="hint" data-i18n="world.importHint"></div>
            <div class="progress is-hidden" id="upload-progress"><div></div></div>
            <button class="btn btn-primary" type="submit" data-i18n="world.importSubmit"></button>
          </form>
        </div>

        <div class="card card-danger">
          <div class="card-head"><h2 data-i18n="world.regenTitle"></h2></div>
          <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.regen"></p></details>
          <form id="regen-form" class="form">
            <label>
              <span data-i18n="world.regenSeed"></span>
              <span class="muted" data-i18n="world.regenSeedOpt"></span>
              <input name="seed" inputmode="numeric" autocomplete="off" data-i18n-ph="world.regenSeedPh">
            </label>
            <label><span data-i18n="world.regenSize"></span>
              <!-- 4500, not adminctl's 20000: pre-generation scales with area,
                   and the shell keeps the full range for an operator. -->
              <input name="size" type="number" min="500" max="4500" step="100" value="3000">
            </label>
            <label><span data-i18n="world.regenType"></span>
              <select name="level_type">
                <option value="normal" data-i18n="world.typeNormal"></option>
                <option value="flat" data-i18n="world.typeFlat"></option>
                <option value="large_biomes" data-i18n="world.typeLarge"></option>
              </select>
            </label>
            <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.worldType"></p></details>
            <label><span data-i18n="world.regenStructures"></span>
              <select name="structures">
                <option value="true" data-i18n="world.structuresYes"></option>
                <option value="false" data-i18n="world.structuresNo"></option>
              </select>
            </label>
            <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.structures"></p></details>
            <div class="hint hint-danger" data-i18n="world.regenHint"></div>
            <button class="btn btn-danger" type="submit" data-i18n="world.regenSubmit"></button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= ACTIVITY ================= -->
  <!-- ================= SETTINGS =================
       Deliberately its own section rather than a card inside World. Everything
       here is instant, reversible and harmless; the World view holds the button
       that wipes the map. Putting the knob a 12-year-old opens every week next
       to the one that destroys three months of building is a layout decision,
       and this is the layout decision. -->
  <section class="view is-hidden" id="view-settings">
    <div class="cards">
      <div class="card">
        <div class="card-head"><h2 data-i18n="settings.title"></h2></div>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.settings"></p></details>
        <div class="notice" data-i18n="settings.instant"></div>
        <div id="settings-list"></div>
      </div>
    </div>
  </section>

  <section class="view is-hidden" id="view-activity">
    <div class="split">
      <div class="card">
        <div class="card-head"><h2 data-i18n="activity.auditTitle"></h2></div>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.audit"></p></details>
        <div class="table-wrap tall">
          <table id="audit-table">
            <thead><tr>
              <th data-i18n="activity.thWhen"></th>
              <th data-i18n="activity.thFrom"></th>
              <th data-i18n="activity.thWhat"></th>
            </tr></thead>
            <tbody><tr><td colspan="3" class="empty" data-i18n="players.loading"></td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="activity.consoleTitle"></h2>
          <button class="btn btn-ghost btn-sm" id="btn-logs" data-i18n="activity.refresh"></button>
        </div>
        <details class="help"><summary data-i18n="help.open"></summary><p data-i18n="help.console"></p></details>
        <pre class="console" id="server-logs"></pre>
      </div>
    </div>
  </section>

</main>

<!-- Job overlay: shown while a long operation runs -->
<div class="overlay is-hidden" id="job-overlay">
  <div class="job card">
    <div class="card-head">
      <h2><span id="job-title"></span></h2>
      <span class="pill" id="job-state"><span class="dot"></span><span></span></span>
    </div>
    <p class="muted" id="job-note"></p>
    <pre class="console" id="job-log"></pre>
    <button class="btn btn-ghost" id="job-close" data-i18n="job.close"></button>
  </div>
</div>

<!-- Confirm dialog -->
<div class="overlay is-hidden" id="confirm-overlay">
  <div class="card confirm">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <!-- Typing gate. Only the world-destroying action uses it: a misclick can
         no longer wipe three months of building, and a child exploring the
         panel has to mean it. Everything else keeps the plain yes/no. -->
    <label class="confirm-phrase is-hidden" id="confirm-phrase-wrap">
      <span id="confirm-phrase-label"></span>
      <input id="confirm-phrase" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </label>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-no" data-i18n="confirm.no"></button>
      <button class="btn btn-danger" id="confirm-yes" data-i18n="confirm.yes"></button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
